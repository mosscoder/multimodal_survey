# Sources, filters, media, split, and publishing

[sources]
enabled = ["inaturalist"]

[filters]
has_coordinates        = true   # keep records that carry a location, needed for the geographic split
require_research_grade = true   # community confirmed identifications only
exclude_captive        = true   # wild plants only, drop cultivated or planted individuals
# license keep-list (opt-in): only these redistributable / iNat-default licenses are kept (drops all-rights-reserved)
license = ["CC0", "PUBLIC-DOMAIN", "CC-BY", "CC-BY-SA", "CC-BY-NC", "CC-BY-NC-SA"]
# year_range           = [2010, 2026]   # optional, restrict to recent years (this cuts data for rare species)
# max_coordinate_uncertainty_m = 1000   # optional, reject locations vaguer than this many meters

[media]
max_images            = 1000       # target per species (license-filtered); only 512/species is ever used by the size sweep
images_per_occurrence = 1          # one photo per observation, for diversity and a clean train and test split
min_pixels            = 256        # skip an image whose shorter side is below this many pixels
max_dimension         = 1024       # shrink the longer side to this many pixels, keeping proportions
prefer_size           = "original" # request the full resolution iNaturalist image
sampling              = "month_balanced"  # equalize candidates across observed month-of-year, capped
                                          # to per-month availability, so seasonal/phenological coverage is
                                          # uniform rather than a recency snapshot. See RESEARCH_LOG 2026-06-29.

[output]
dir = "/Users/kdoherty/multimodal_survey/inat_dataset/plants/out"

[split]
strategy      = "random"   # random, geographic (spatial blocking), or temporal
test_fraction = 0.2        # the share of each species held back for testing
seed          = 1312       # a fixed seed so the same division repeats exactly
# cell_size_deg   = 1.0    # for geographic, the size of the grid cells in degrees
# test_after_year = 2024   # for temporal, send observations from this year onward into the test set

[publish]
private = true    # create the dataset as private on the Hugging Face Hub
push    = false   # set to true to actually upload, which needs HF_TOKEN in the environment
# repo_id = "mosscoder/montana_rangeland_plants"   # optional, the dataset name on the Hub

[dataset]
name        = "Montana native and invasive plants (50 species)"
description = "A set of 50 plant species of western Montana rangeland, spanning native forbs and grasses and invasive forbs and grasses, harvested from iNaturalist for a species level image classifier. Each species is its own configuration with its own train and test split. Candidates are sampled month-balanced across the year (not newest-first) for even seasonal coverage."
