name        = "site_1_strip_3"
description = "Lawnmower line survey of site 1, strip 3: the ~150 m × 17 m strip polygon boxified to a 150.25 m × 20 m grid — 4 identical 150.25 m legs at exact 5 m spacing along the strip axis (auto bearing 113.4°), starting at the southern corner, walked at 1 m/s, capturing a clean frame every 2 m of along-track travel (~300 captures, ~601 m of survey track), steered by cross_track (GPS-course pure pursuit). Waypoints generated from seed_poly.geojson (QGIS polygon, EPSG:6514)."
mode        = "nav"

# Run by path. On the dog's Jetson (repo cloned on the KINGSTON datastick):
#   go2-survey run /media/mpg-robodog/KINGSTON/multimodal_survey/dev/site_1_strip_3
# Run outputs (logs, captures, sidecars) land on the datastick at
#   <output_dir>/site_1_strip_3/site_1_strip_3_<timestamp>/
# i.e. OUTSIDE this clone, so field data never piles up in git. On a dev
# machine without /media/mpg-robodog/KINGSTON, override per-run:
#   GO2_SURVEY_OUTPUT_DIR=/tmp/go2-out go2-survey run dev/site_1_strip_3 --dry-run
output_dir = "/media/mpg-robodog/KINGSTON/survey_outputs"

[gps]
port = "/dev/ttyACM0"
baud = 38400

[ntrip]
host        = "caster.emlid.com"
port        = 2101
mountpoints = ["MP22385", "MP22385a"]
usernames   = ["u26787",  "u26787"]
passwords   = ["492utz",  "492utz"]

[robot]
connection_mode = "LocalSTA"

[navigation]
arrival_tolerance = 0.25
max_velocity      = 1.0
rotation_rate     = 0.8
min_fix_type      = 4
max_hacc          = 0.10
gps_fix_timeout   = 300

[capture]
# Line survey with cross_track leg steering — the 09-validated config:
# drive straight legs between the corner waypoints at [navigation]
# max_velocity, turn in place at each corner, and capture a clean frame
# every capture_interval_m of along-track travel. Capture points are not
# waypoints — each image is geotagged with its own interpolated RTK
# position; EXIF bearing is finalized post-hoc from the RTK track.
strategy           = "line_survey"
capture_interval_m = 2.0
output_subdir      = "captures"
leg_steering       = "cross_track"
lookahead_m        = 4.0
course_lookback_m  = 1.0
