# pixelflora request: SKY / CLOUD hard-negative source (birds in flight)
#
# Bald eagle (Haliaeetus leucocephalus) — tens of thousands of iNaturalist
# observations, very frequently photographed IN FLIGHT against open sky/cloud.
# Used as a single auxiliary "Sky" hard-negative class for the plant detector:
# at train time we crop the upper-left and upper-right 224 windows of each image
# (the bird is typically centered, so the corners are sky/cloud), teaching the
# head that bright sky/cloud is NOT a target forb (lupine/blanketflower).
#
# Run "pixelflora resolve birds/request.toml" first to confirm the taxon resolves.

[[species]]
genus = "Haliaeetus"
species = "leucocephalus"      # bald eagle (Aves) — iconic_taxon Aves, harvested like any taxon

# Sources, filters, media, split, and publishing

[sources]
enabled = ["inaturalist"]

[filters]
has_coordinates        = false  # sky has no geography; the split is random, so coords aren't needed
require_research_grade = true   # community-confirmed IDs only
exclude_captive        = true   # WILD birds only — drops rehab/zoo eagles (perched indoors, not sky)
# license keep-list (opt-in): only these redistributable / iNat-default licenses are kept
license = ["CC0", "PUBLIC-DOMAIN", "CC-BY", "CC-BY-SA", "CC-BY-NC", "CC-BY-NC-SA"]

[media]
max_images            = 1000       # target; only 512/species is ever used by the size sweep
images_per_occurrence = 1          # one photo per observation, for diversity + a clean split
min_pixels            = 256        # skip an image whose shorter side is below this many pixels
max_dimension         = 1024       # corner-crop assumes ~1024px images, matching the plants
prefer_size           = "original" # request the full resolution iNaturalist image
sampling              = "month_balanced"  # equalize eagle obs across month-of-year so the Sky class
                                          # includes WINTER/overcast skies (recency-only was ~84% June,
                                          # ~3% winter; availability is ~29% Dec-Feb). See RESEARCH_LOG.

[output]
dir = "/Users/kdoherty/multimodal_survey/inat_dataset/birds/out"

[split]
strategy      = "random"   # random split; sky has no geography
test_fraction = 0.2        # iNat 'test' split is just more free training data here
seed          = 1312       # fixed seed so the same division repeats exactly

[publish]
private = true    # private dataset (internal training use)
push    = false   # no Hub upload

[dataset]
name        = "Sky / cloud hard negatives (bald eagle, in flight)"
description = "Bald eagle (Haliaeetus leucocephalus) iNaturalist images, used as a sky/cloud hard-negative class for a plant detector via upper-corner (sky-maximizing) crops."
