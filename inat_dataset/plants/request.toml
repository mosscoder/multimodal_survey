# pixelflora request: western Montana rangeland plants (38 species)
#
# A species level image classifier built from iNaturalist observations. The
# species are grouped below into four functional groups (native forbs, native
# grasses, invasive grasses, invasive forbs). pixelflora has no group field, so
# that grouping lives in these comments only. Every species becomes its own
# Hugging Face configuration with its own train and test split, so a single
# species can be added or refreshed later without disturbing the others.
#
# Nomenclature notes:
#   Several names were corrected or updated to the taxon iNaturalist treats as
#   accepted (see the inline comments). Run "pixelflora resolve <this file>" first
#   to confirm all 36 map to the taxa you intend before harvesting anything.

# Native forbs

[[species]]
genus = "Balsamorhiza"
species = "sagittata"

[[species]]
genus = "Lupinus"
species = "sericeus"

[[species]]
genus = "Gaillardia"
species = "aristata"

[[species]]
genus = "Achillea"
species = "millefolium"

[[species]]
genus = "Helianthus"
species = "annuus"          # corrected from "annua"

[[species]]
genus = "Helianthus"
species = "maximiliani"

[[species]]
genus = "Antennaria"
species = "parvifolia"

# Boechera pendulocarpa excluded: iNaturalist has only 53 matching observations, far below the cap
# [[species]]
# genus = "Boechera"
# species = "pendulocarpa"

[[species]]
genus = "Collomia"
